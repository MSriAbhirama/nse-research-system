spring.application.name=data-ingestion-service
server.port=8081
# company-service.url=http://localhost:8080

spring.kafka.bootstrap-servers=localhost:9092

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.companyService.register-health-indicator=true
resilience4j.circuitbreaker.instances.companyService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.companyService.sliding-window-size=10
resilience4j.circuitbreaker.instances.companyService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.companyService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.companyService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.companyService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.companyService.automatic-transition-from-open-to-half-open-enabled=true

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# Circuit Breaker health
management.health.circuitbreakers.enabled=true

# Resilience4j Retry
resilience4j.retry.instances.companyServiceRetry.max-attempts=3
resilience4j.retry.instances.companyServiceRetry.wait-duration=1s
resilience4j.retry.instances.companyServiceRetry.enable-exponential-backoff=true
resilience4j.retry.instances.companyServiceRetry.exponential-backoff-multiplier=2

# Retry only transient failures
resilience4j.retry.instances.companyServiceRetry.retry-exceptions[0]=feign.RetryableException
resilience4j.retry.instances.companyServiceRetry.retry-exceptions[1]=feign.FeignException$ServiceUnavailable
resilience4j.retry.instances.companyServiceRetry.retry-exceptions[2]=feign.FeignException$BadGateway
resilience4j.retry.instances.companyServiceRetry.retry-exceptions[3]=feign.FeignException$GatewayTimeout